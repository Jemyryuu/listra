<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listen Together - Spotify Synchronized Listening</title>
  <style>
    :root {
      --bg: #121212;
      --card: #181818;
      --green: #1db954;
      --green-hover: #1ed760;
      --text: #ffffff;
      --subtext: #a7a7a7;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: var(--card);
      padding: 40px;
      border-radius: 12px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 16px 32px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      fill: var(--green);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .room-badge {
      display: inline-block;
      background: #282828;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--green);
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      border-radius: 24px;
      background: var(--green);
      color: #000;
      font-weight: bold;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s;
      box-sizing: border-box;
    }
    .btn:hover {
      background: var(--green-hover);
      transform: scale(1.02);
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      color: var(--subtext);
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12v6c0 1.66 1.34 3 3 3h1c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1H4v-1c0-4.41 3.59-8 8-8s8 3.59 8 8v1h-2c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h1c1.66 0 3-1.34 3-3v-6c0-5.52-4.48-10-10-10z"/>
    </svg>
    <h1>Listen Together</h1>
    <p>Connecting you to the live Spotify synchronized session...</p>
    
    <div id="roomContainer" style="display: none;">
      <div class="room-badge" id="roomCode">------</div>
      <button class="btn" id="openBtn">Open in Spotify</button>
    </div>

    <div class="status" id="statusText">Checking local companion daemon...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const room = (params.get('room') || '').toUpperCase().trim();
    const statusText = document.getElementById('statusText');
    const roomContainer = document.getElementById('roomContainer');
    const roomCode = document.getElementById('roomCode');
    const openBtn = document.getElementById('openBtn');

    if (room && /^[A-Z0-9]{6}$/.test(room)) {
      roomCode.innerText = room;
      roomContainer.style.display = 'block';
      fetch(`http://127.0.0.1:8989/join?room=${room}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.ok) {
            statusText.innerText = 'Connected! Spotify is synchronizing now...';
            setTimeout(() => {
              window.close();
            }, 2000);
          } else {
            statusText.innerText = 'Spotify is open, but Listen Together extension is waiting...';
          }
        })
        .catch(() => {
          statusText.innerText = 'Opening via Listen Together protocol...';
          window.location.href = `listentogether://join/${room}`;
        });

      openBtn.addEventListener('click', () => {
        window.location.href = `listentogether://join/${room}`;
      });
    } else {
      statusText.innerText = 'Invalid or missing Room Code in link.';
    }
  </script>
</body>
</html>
